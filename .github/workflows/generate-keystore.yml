name: Generate Fixed Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: generate fixed keystore
      run: |
        mkdir -p iknow-scanner2
        # 若仓库内尚无固定 keystore，才生成（避免覆盖已固定密钥）
        if [ ! -f "iknow-scanner2/keystore.jks" ]; then
          keytool -genkeypair -v \
            -keystore "iknow-scanner2/keystore.jks" \
            -storepass android -keypass android \
            -alias android -keyalg RSA -keysize 2048 \
            -dname "CN=CI, OU=Dev, O=IknowScanner, L=Unknown, ST=Unknown, C=US" \
            -validity 10000
          echo "已生成固定 keystore"
        else
          echo "仓库内已存在固定 keystore，跳过生成"
        fi

    - name: commit keystore to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add iknow-scanner2/keystore.jks
        if git diff --cached --quiet; then
          echo "无变更，keystore 已存在"
        else
          git commit -m "chore: 添加固定签名 keystore"
          git push
        fi

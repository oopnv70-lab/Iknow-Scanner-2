name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 不再使用 android-actions/setup-android@v3：
    # 该 action 内部会执行 sdkmanager tools，而 Google 已从 SDK 仓库下架 tools 包，
    # 导致 "Failed to find package 'tools'" -> exit 1 -> 整个 job 失败（与项目代码无关）。
    # ubuntu-latest runner 本身已预装 Android SDK（ANDROID_SDK_ROOT=/usr/local/lib/android/sdk），
    # 这里直接用其自带的 sdkmanager，避免第三方 action 的兼容性风险。
    - name: install Android platform & build-tools
      run: |
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

    - name: prepare signing keystore (复用仓库内固定 keystore)
      run: |
        mkdir -p "$HOME/.apksigner"
        # 优先使用仓库内已提交的固定 keystore
        if [ -f "iknow-scanner2/keystore.jks" ]; then
          cp "iknow-scanner2/keystore.jks" "$HOME/.apksigner/keystore.jks"
          echo "使用仓库内固定 keystore，签名稳定"
        else
          # 仓库内尚无 keystore，临时生成（签名不稳定，需运行 generate-keystore 工作流固定）
          keytool -genkeypair -v \
            -keystore "$HOME/.apksigner/keystore.jks" \
            -storepass android -keypass android \
            -alias android -keyalg RSA -keysize 2048 \
            -dname "CN=CI, OU=Dev, O=IknowScanner, L=Unknown, ST=Unknown, C=US" \
            -validity 10000
          echo "::warning::仓库内无固定 keystore，本次签名不稳定，请运行 generate-keystore 工作流"
        fi

    - name: build with build.sh
      run: |
        export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
        export PATH="$ANDROID_SDK_ROOT/build-tools/36.0.0:$PATH"
        sh iknow-scanner2/build.sh

    - name: upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: iknow-scanner2
        path: iknow-scanner2/iknow-scanner2.apk

    - name: publish as pre-release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v0.1.0-${{ github.run_number }}
        name: 测试版 v0.1.0 (build ${{ github.run_number }})
        prerelease: true
        generate_release_notes: true
        files: iknow-scanner2/iknow-scanner2.apk
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: set up Android SDK
      uses: android-actions/setup-android@v3

    - name: install Android platform & build-tools
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0"

    - name: generate signing keystore
      run: |
        mkdir -p "$HOME/.apksigner"
        if [ ! -f "$HOME/.apksigner/keystore.jks" ]; then
          keytool -genkeypair -v \
            -keystore "$HOME/.apksigner/keystore.jks" \
            -storepass android -keypass android \
            -alias android -keyalg RSA -keysize 2048 \
            -dname "CN=CI, OU=Dev, O=IknowScanner, L=Unknown, ST=Unknown, C=US" \
            -validity 10000
        fi

    - name: build with build.sh
      run: |
        export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
        export PATH="$ANDROID_SDK_ROOT/build-tools/36.0.0:$PATH"
        sh iknow-scanner2/build.sh

    - name: upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: iknow-scanner2
        path: iknow-scanner2/iknow-scanner2.apk